<section class="rfq">
  <div class="rfq__inner">
    <span class="lbl">Request for quotation</span>
    <h2 class="rfq__title">Tell us what to build.</h2>
    <p class="rfq__lede">A web app, a mobile app, a platform, an integration nobody else wants to touch. Send the brief, we reply with questions, a scope and a price.</p>
    <div class="rfq__actions">
      <a class="btn btn--red btn--lg" href="{{ "/contact/" | relURL }}">Open the RFQ form</a>
      <a class="rfq__mail" href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
    </div>
  </div>
</section>
