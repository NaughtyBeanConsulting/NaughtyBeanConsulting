{{- $title := cond .IsHome site.Title (printf "%s | %s" .Title site.Title) -}}
{{- $desc := .Params.description | default .Summary | default site.Params.description | plainify -}}
{{- $img := site.Params.socialImage | absURL -}}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $title }}</title>
<meta name="description" content="{{ $desc }}">
<link rel="canonical" href="{{ .Permalink }}">
<meta name="theme-color" content="#f1ede3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e2440" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:title" content="{{ $title }}">
<meta property="og:description" content="{{ $desc }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ $img }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ $title }}">
<meta name="twitter:description" content="{{ $desc }}">
<meta name="twitter:image" content="{{ $img }}">

<link rel="icon" type="image/svg+xml" href="{{ "img/favicon.svg" | relURL }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ "img/favicon-32.png" | relURL }}">
<link rel="apple-touch-icon" href="{{ "img/apple-touch-icon.png" | relURL }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ "css/site.css" | relURL }}">

<script>
  // Theme: PAPER (light) or BLUEPRINT (dark). Set before paint to avoid a flash.
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get("theme"); } catch (e) {}
    if (t === "paper" || t === "blueprint") { try { localStorage.setItem("nbc-theme", t); } catch (e) {} }
    else { try { t = localStorage.getItem("nbc-theme"); } catch (e) {} }
    if (t !== "paper" && t !== "blueprint") {
      t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "blueprint" : "paper";
    }
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfessionalService",
  "name": "Naughty Bean Consulting",
  "url": "{{ site.BaseURL }}",
  "email": "{{ site.Params.email }}",
  "description": {{ site.Params.description | jsonify }},
  "areaServed": "ZA",
  "knowsAbout": ["Software engineering", "Web applications", "Mobile applications", "SaaS platforms", "Payment integrations", "AWS"],
  "sameAs": ["{{ site.Params.github }}"]
}
</script>
